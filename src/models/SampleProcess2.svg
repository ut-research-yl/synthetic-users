  <!-- Arrow marker definitions -->
  <defs>
    <!-- Horizontal arrow -->
    <marker 
      id="arrowhead-horizontal" 
      markerWidth="6" 
      markerHeight="6" 
      refX="6" 
      refY="3" 
      orient="auto"
    >
      <polygon points="0 0, 6 3, 0 6" fill="#758CA4" stroke="none" />
    </marker>
    
    <!-- Vertical arrow - downward -->
    <marker 
      id="arrowhead-vertical-down" 
      markerWidth="6" 
      markerHeight="6" 
      refX="3" 
      refY="6"
    >
      <polygon points="0 0, 6 0, 3 6" fill="#758CA4" stroke="none" />
    </marker>

    <!-- Vertical arrow - upward -->
    <marker 
      id="arrowhead-vertical-up" 
      markerWidth="6" 
      markerHeight="6" 
      refX="3" 
      refY="0"
    >
      <polygon points="0 6, 6 6, 3 0" fill="#758CA4" stroke="none" />
    </marker>
  </defs>

  <!-- ARROWS LAYER -->
  
  <!-- Start to Check customer -->
  <path d="M 95 100 L 149 100" stroke="#758CA4" stroke-width="2" fill="none" marker-end="url(#arrowhead-horizontal)" />
  
  <!-- Check customer to Type gateway -->
  <path d="M 250 100 L 294 100" stroke="#758CA4" stroke-width="2" fill="none" marker-end="url(#arrowhead-horizontal)" />
  
  <!-- Type gateway - Paper path (right) -->
  <path d="M 336 100 L 379 100" stroke="#758CA4" stroke-width="2" fill="none" marker-end="url(#arrowhead-horizontal)" />
  
  <!-- Type gateway - E-Bills path (bent arrow: down then right to intermediate event) -->
  <path d="M 315 121 L 315 310" stroke="#758CA4" stroke-width="2" fill="none" />
  <path d="M 315 310 L 415 310" stroke="#758CA4" stroke-width="2" fill="none" marker-end="url(#arrowhead-horizontal)" />
  
  <!-- Generate PDF to Many Invoices gateway -->
  <path d="M 480 100 L 523 100" stroke="#758CA4" stroke-width="2" fill="none" marker-end="url(#arrowhead-horizontal)" />
  
  <!-- Many Invoices - Yes (up) -->
  <path d="M 544 79 L 544 50 L 659 50" stroke="#758CA4" stroke-width="2" fill="none" marker-end="url(#arrowhead-horizontal)" />
  
  <!-- Many Invoices - No (down) -->
  <path d="M 544 121 L 544 150 L 659 150" stroke="#758CA4" stroke-width="2" fill="none" marker-end="url(#arrowhead-horizontal)" />
  
  <!-- Use Print Transaction to merge gateway (up arrow) -->
