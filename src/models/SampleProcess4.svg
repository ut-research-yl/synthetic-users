  </foreignObject>
  
  <!-- Task: Onboard candidate -->
  <rect x="990" y="125" width="100" height="50" rx="5" fill="white" stroke="black" stroke-width="2" />
  <foreignObject x="990" y="125" width="100" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      Nostrud Exercitat
    </div>
  </foreignObject>
  
  <!-- End Event: Candidate hired -->
  <circle cx="1149" cy="150" r="15" fill="white" stroke="black" stroke-width="4" />
  <foreignObject x="1099" y="180" width="100" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      End event 1
    </div>
  </foreignObject>
  
  <!-- Task: Send rejection (first one) -->
  <rect x="380" y="225" width="100" height="50" rx="5" fill="white" stroke="black" stroke-width="2" />
  <foreignObject x="380" y="225" width="100" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      Ullamco Laboris
    </div>
  </foreignObject>

  <!-- End Event: Application rejected (first) -->
  <circle cx="539" cy="250" r="15" fill="white" stroke="black" stroke-width="4" />
  <foreignObject x="489" y="280" width="100" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      End event 2
    </div>
  </foreignObject>

  <!-- Task: Send rejection (second one) -->
  <rect x="645" y="330" width="100" height="50" rx="5" fill="white" stroke="black" stroke-width="2" />
  <foreignObject x="645" y="330" width="100" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      Veniam Quis Est
    </div>
  </foreignObject>

  <!-- End Event: Application rejected (second) -->
  <circle cx="804" cy="355" r="15" fill="white" stroke="black" stroke-width="4" />
  <foreignObject x="754" y="385" width="100" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      End event 3
    </div>
  </foreignObject>

  <!-- End Event: Candidate has rejected -->
  <circle cx="1034" cy="250" r="15" fill="white" stroke="black" stroke-width="4" />
  <foreignObject x="984" y="280" width="100" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      End event 4
    </div>
  </foreignObject>
</svg>