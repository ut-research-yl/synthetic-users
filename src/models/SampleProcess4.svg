    transform="rotate(45, 695, 150)"
  />
  <foreignObject x="645" y="85" width="100" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      Aliqua Eiusmod?
    </div>
  </foreignObject>
  
  <!-- Yes label - moved 6px up and 4px left -->
  <foreignObject x="716" y="129" width="30" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      Yes
    </div>
  </foreignObject>
  
  <!-- No label -->
  <foreignObject x="700" y="170" width="30" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      No
    </div>
  </foreignObject>
  
  <!-- Task: Make offer -->
  <rect x="760" y="125" width="100" height="50" rx="5" fill="white" stroke="black" stroke-width="2" />
  <foreignObject x="760" y="125" width="100" height="50">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      Amet Velit
    </div>
  </foreignObject>
  
  <!-- Gateway: Offer accepted? -->
  <rect 
    x="910" 
    y="135" 
    width="30" 
    height="30" 
    rx="4" 
    fill="white" 
    stroke="black" 
    stroke-width="2" 
    transform="rotate(45, 925, 150)"
  />
  <foreignObject x="875" y="85" width="100" height="30">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      Ipsum Occaecat?
    </div>
  </foreignObject>
  
  <!-- Yes label - moved 6px up and 4px left -->
  <foreignObject x="946" y="129" width="30" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      Yes
    </div>
  </foreignObject>
  
  <!-- No label -->
  <foreignObject x="930" y="170" width="30" height="20">
    <div xmlns="http://www.w3.org/1999/xhtml" style="display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 8px; text-align: center; font-size: 12px; color: #131E29; font-family: '72', sans-serif">
      No
